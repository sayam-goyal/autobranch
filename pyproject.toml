[project]
name = "autobranch"
version = "0.1.0"
description = "Generalized reward-search RL framework on Modal"
requires-python = ">=3.11"
dependencies = ["modal>=1.6.4", "pyyaml>=6.0", "numpy>=1.24"]

[project.optional-dependencies]
train = ["torch>=2.2"]
serve = ["fastapi==0.115.12", "starlette<0.42", "uvicorn==0.34.3", "websockets==12.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: deselect with -m 'not slow'"]

[tool.setuptools.packages.find]
include = ["autobranch*"]
